services:
  app:
    build:
      context: ../..
      dockerfile: ops/local/Dockerfile
    container_name: equaly-app-local
    working_dir: /var/www/html
    volumes:
      - ../../:/var/www/html
      - sqlite_data:/var/www/html/database
      - uploads_data:/var/www/html/storage/app/public
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:9090
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - SESSION_DRIVER=database
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
    networks:
      - equaly-local

  nginx:
    image: nginx:alpine
    container_name: equaly-nginx-local
    ports:
      - "9090:80"
    volumes:
      - ../../:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - equaly-local

  vite:
    image: node:20-alpine
    container_name: equaly-vite-local
    working_dir: /var/www/html
    command: ["sh", "-c", "npm install --ignore-scripts && npm run dev"]
    volumes:
      - ../../:/var/www/html
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - equaly-local

volumes:
  sqlite_data:
    driver: local
  uploads_data:
    driver: local

networks:
  equaly-local:
    driver: bridge
