services:
  app:
    build:
      context: ../..
      dockerfile: ops/production/Dockerfile
    container_name: equaly-app-prod
    working_dir: /var/www/html
    volumes:
      - sqlite_data:/var/www/html/database
      - uploads_data:/var/www/html/storage/app/public
      - ../../.env:/var/www/html/.env:ro
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - SESSION_DRIVER=database
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
    restart: unless-stopped
    networks:
      - equaly-production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: equaly-nginx-prod
    ports:
      - "80:80"
    volumes:
      - ../../public:/var/www/html/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - equaly-production

volumes:
  sqlite_data:
    driver: local
  uploads_data:
    driver: local

networks:
  equaly-production:
    driver: bridge
